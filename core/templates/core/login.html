{% extends 'core/base_auth.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="text-center mb-4">
        <i class="bi bi-mortarboard-fill fs-36 text-primary"></i>
        <h2 class="mt-2 mb-0">Welcome back</h2>
        <p class="text-muted">Log in to continue your study streak</p>
    </div>
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'danger' }}">{{ message }}</div>
    {% endfor %}
    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
